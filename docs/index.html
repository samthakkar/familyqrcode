<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta
      name="description"
      content="Family event entry details"
    >
    <title>Family Event Pass</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        display: grid;
        place-items: center;
        background: #171540;
        font-family: Georgia, "Times New Roman", serif;
      }

      .poster {
        position: relative;
        width: min(100%, 520px);
        aspect-ratio: 768 / 1086;
        overflow: hidden;
        background: url("./assets/qr-poster-template.png") center / 100% 100%;
        box-shadow: 0 16px 48px #08072c88;
      }

      .welcome,
      .details {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fffdfd;
        text-align: center;
      }

      .welcome {
        top: 21.5%;
        left: 13%;
        width: 74%;
        height: 18.5%;
        padding: 8px 14px;
        border: 3px solid #e8b44e;
        border-radius: 80px;
        outline: 2px solid #b767ae;
        outline-offset: -9px;
      }

      .welcome h1 {
        margin: 0;
        color: #310040;
        font-size: clamp(17px, 5.4vw, 30px);
        line-height: 1.12;
        overflow-wrap: anywhere;
      }

      .welcome .organization {
        margin: 0 0 4px;
        color: #50004f;
        font-size: clamp(11px, 3vw, 16px);
        font-weight: 700;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .welcome p {
        margin: 5px 0 0;
        color: #50004f;
        font-size: clamp(12px, 3.5vw, 18px);
        font-style: italic;
      }

      .details {
        top: 39.5%;
        left: 18%;
        width: 64%;
        height: 47%;
        gap: clamp(7px, 2.1vw, 14px);
        padding: clamp(12px, 3vw, 22px);
        border: 4px solid #b767ae;
        border-radius: 28px;
        outline: 2px solid #e8b44e;
        outline-offset: -10px;
        color: #24134b;
        font-family: Arial, sans-serif;
        font-size: clamp(12px, 3.6vw, 19px);
        text-align: left;
      }

      .detail {
        width: 100%;
        overflow-wrap: anywhere;
      }

      .detail strong {
        display: block;
        margin-bottom: 2px;
        color: #50004f;
        font-size: 0.88em;
      }

      .detail span {
        display: block;
      }

      .message {
        width: min(100%, 520px);
        padding: 24px;
        border: 2px solid #e8b44e;
        border-radius: 16px;
        background: #fffdfd;
        color: #310040;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="poster" id="pass" hidden>
      <header class="welcome">
        <p class="organization" id="organization"></p>
        <h1 id="welcome"></h1>
        <p id="subtitle" hidden></p>
      </header>
      <section class="details" aria-label="Family entry details">
        <div class="detail">
          <strong>Family name</strong>
          <span id="family"></span>
        </div>
        <div class="detail">
          <strong>Number of people</strong>
          <span id="people"></span>
        </div>
        <div class="detail">
          <strong>Date</strong>
          <span id="date"></span>
        </div>
        <div class="detail">
          <strong>Entry Time</strong>
          <span id="slot"></span>
        </div>
      </section>
    </main>
    <main class="message" id="message" hidden>
      <h1>Family event pass</h1>
      <p>This QR link is missing some family details. Please contact the event organizer.</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const family = (params.get("family") || "").trim();
      const people = Number(params.get("people"));
      const eventName = (params.get("event") || "").trim().replace(/^to\s+/i, "");
      const headline = (params.get("headline") || "Welcome").trim();
      const subtitle = (params.get("subtitle") || "").trim();
      const organization = (params.get("organization") || "").trim();
      const eventDate = (params.get("date") || "").trim();
      const timeSlot = (params.get("slot") || "").trim();

      function formatDate(value) {
        const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!parts) {
          return value;
        }
        const date = new Date(
          Number(parts[1]),
          Number(parts[2]) - 1,
          Number(parts[3]),
          12
        );
        return new Intl.DateTimeFormat(undefined, {
          day: "numeric",
          month: "long",
          year: "numeric",
        }).format(date);
      }

      if (
        family &&
        Number.isInteger(people) &&
        people > 0 &&
        eventName &&
        eventDate &&
        timeSlot
      ) {
        document.getElementById("welcome").textContent =
          `${headline || "Welcome"} To ${eventName}`;
        document.getElementById("organization").textContent = organization;
        document.getElementById("organization").hidden = !organization;
        document.getElementById("subtitle").textContent = subtitle;
        document.getElementById("subtitle").hidden = !subtitle;
        document.getElementById("family").textContent = family;
        document.getElementById("people").textContent = String(people);
        document.getElementById("date").textContent = formatDate(eventDate);
        document.getElementById("slot").textContent = timeSlot;
        document.getElementById("pass").hidden = false;
        document.title = `${family} | ${eventName}`;
      } else {
        document.getElementById("message").hidden = false;
      }
    </script>
  </body>
</html>
